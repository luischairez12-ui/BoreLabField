  <title>BoreLab Field — HDD Crew Tools</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn small" data-action="open-settings" aria-label="Settings">☰</button>
      <div class="brand"><div class="brand-mark">B<span>↗</span></div><div><strong>BoreLab <em>Field</em></strong><small>HDD CREW OPERATIONS</small></div></div>
      <div class="top-date" id="topDate"></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-link active" data-page="home"><span class="nav-icon">⌂</span><small>Home</small></button>
      <button class="nav-link" data-page="planner"><span class="nav-icon">⌁</span><small>Planner</small></button>
      <button class="new-shot-nav" data-action="new-shot" aria-label="New bore shot">+</button>
      <button class="nav-link" data-page="photos"><span class="nav-icon">▣</span><small>Photos</small></button>
      <button class="nav-link" data-page="crew"><span class="nav-icon">◷</span><small>Crew</small></button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="cameraFile" accept="image/*" capture="environment" hidden>
  <input type="file" id="galleryFile" accept="image/*" hidden>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
/* BoreLab Field v0.1 — all data stays on this device unless explicitly exported. */
(() => {
'use strict';
const KEY='borelab-field-v0.1'; // retain existing data key across upgrades
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const seed=()=>({version:1,demo:true,jobName:'Demo Job · South Glades',allowance:10,pipeAvailable:345,shopName:'',shopAddress:'',shopLat:'',shopLon:'',routeMode:'toward',shotDurationRate:45,setupMinutes:25,roster:[],selectedCrewIds:[],shots:[{id:uid(),name:'Shot 01',feet:175,address:'',lat:'',lon:'',notes:'',status:'complete',completedAt:new Date().toISOString()},{id:uid(),name:'Shot 02',feet:155,address:'',lat:'',lon:'',notes:'',status:'planned'},{id:uid(),name:'Shot 03',feet:90,address:'',lat:'',lon:'',notes:'',status:'planned'},{id:uid(),name:'Shot 04',feet:80,address:'',lat:'',lon:'',notes:'',status:'planned'}],crew:[]});
let state;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');state=s&&Array.isArray(s.shots)?s:seed()}catch{state=seed()}
if(!Array.isArray(state.roster))state.roster=[];
if(!Array.isArray(state.selectedCrewIds))state.selectedCrewIds=state.roster.map(p=>p.id);
if(typeof state.autoLunchEnabled!=='boolean')state.autoLunchEnabled=false;
if(!Number.isFinite(Number(state.defaultLunchMinutes)))state.defaultLunchMinutes=60;
state.defaultLunchMinutes=Math.max(0,Math.min(300,Number(state.defaultLunchMinutes)));
let page='home',modal='',photos=[],pendingPhotoShot='',pendingPhotoKind='camera',geocodeWaitUntil=0,toastTimeout;
const $=s=>document.querySelector(s);
const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});
const fullDate=dt=>new Date(dt).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const feet=s=>Math.max(0,Number(s.feet)||0);
const extra=()=>Math.max(0,Number(state.allowance)||0);
const pipeNeed=s=>feet(s)+extra();
const totalFeet=()=>state.shots.reduce((n,s)=>n+feet(s),0);
const doneFeet=()=>state.shots.filter(s=>s.status==='complete').reduce((n,s)=>n+feet(s),0);
const totalNeed=()=>state.shots.reduce((n,s)=>n+pipeNeed(s),0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('Storage full. Export a backup to preserve your records.')}};
const notify=message=>{const el=$('#toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('visible'),4200)};
const kv=(label,value)=>`<div class="between" style="padding:8px 0"><span class="muted smalltext">${esc(label)}</span><strong style="font-size:13px">${value}</strong></div>`;
const footnote=()=>`<div class="footer-note">BoreLab Field · Android preview v0.3 · Data saved on this device<br>Route distances are straight-line estimates, not driving times. No cloud account required.</div>`;
const bottom=`<div style="height:3px"></div>`;
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('borelab-photos-v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function photoDB(op,arg){const database=await db();return new Promise((resolve,reject)=>{const tx=database.transaction('photos',op==='list'?'readonly':'readwrite');const store=tx.objectStore('photos');let request;if(op==='list')request=store.getAll();if(op==='put')request=store.put(arg);if(op==='delete')request=store.delete(arg);if(op==='clear')request=store.clear();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);tx.oncomplete=()=>database.close();tx.onerror=()=>reject(tx.error)})}
async function refreshPhotos(){try{photos=(await photoDB('list')).sort((a,b)=>b.addedAt.localeCompare(a.addedAt))}catch(e){console.warn('Photo storage unavailable:',e);photos=[]}}
function setPage(p){page=p;closeModal();render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));$('#topDate').textContent=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'});$('#main').innerHTML=({home:renderHome,planner:renderPlanner,photos:renderPhotos,crew:renderCrew,settings:renderSettings})[page]?.()||renderHome();}
function section(title,right=''){return `<div class="section-title"><h2><span class="accentbar"></span>${esc(title)}</h2>${right}</div>`}
function quick(label,icon,sub,action){return `<button class="quick" data-action="${action}"><div class="qicon">${icon}</div><strong>${esc(label)}</strong><small>${esc(sub)}</small></button>`}
function shotRow(s){return `<div class="shot"><div class="shot-icon">⌁</div><div><h3>${esc(s.name)} <span class="status ${s.status==='complete'?'complete':s.status==='progress'?'progress':'planned'}">${s.status==='complete'?'Complete':s.status==='progress'?'Drilling':'Pending'}</span></h3><small>${feet(s)} ft bore · ${pipeNeed(s)} ft with allowance<br>${esc(s.address||coordsText(s)||'No location set')}</small></div><div class="shot-actions"><span class="foot">${feet(s)}′</span><button data-action="shot-detail" data-id="${s.id}" aria-label="Open ${esc(s.name)}">›</button></div></div>`}
function renderHome(){const pct=totalFeet()?Math.round(doneFeet()/totalFeet()*100):0;let hasDemo=state.demo?`<div class="note spaced">Sample shots are loaded so you can try the app. Add your real job or tap <b>Clear Demo</b> in Settings to start fresh.</div>`:'';
return `<div class="page"><div class="hero"><span class="eyebrow">HDD FIELD OPERATIONS</span><h1>Ready for today's shots?</h1><p>Plan the route. Count your pipe. Capture the work. Keep your crew organized.</p><div class="hero-tags"><span class="tag teal">● Works offline</span><span class="tag">📍 GPS photo records</span></div></div>
${section("Today's Job",`<button class="btn micro ghost" data-action="edit-job">Edit job</button>`)}<div class="card"><div class="card-head"><div><div class="eyebrow">ACTIVE JOB</div><h2 style="margin-top:5px">${esc(state.jobName)}</h2><p class="muted tiny">${state.shots.length} bore shots · ${state.shots.filter(s=>s.status==='complete').length} completed</p></div><span class="status ${pct===100?'complete':'progress'}">${pct}%</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="stats"><div class="stat"><span>Completed footage</span><strong class="teal">${fmt(doneFeet())}′</strong></div><div class="stat"><span>Planned footage</span><strong>${fmt(totalFeet())}′</strong></div><div class="stat"><span>Pipe required (+${extra()}′/shot)</span><strong class="orange">${fmt(totalNeed())}′</strong></div></div></div>${hasDemo}

function coordsValid(o){return o&&o.lat!==''&&o.lon!==''&&o.lat!=null&&o.lon!=null&&Number.isFinite(Number(o.lat))&&Number.isFinite(Number(o.lon))&&Math.abs(Number(o.lat))<=90&&Math.abs(Number(o.lon))<=180}
function coordsText(s){return coordsValid(s)?`${Number(s.lat).toFixed(5)}, ${Number(s.lon).toFixed(5)}`:''}
function hav(a,b){if(!coordsValid(a)||!coordsValid(b))return NaN;const R=3958.7613,lat1=Number(a.lat)*Math.PI/180,lat2=Number(b.lat)*Math.PI/180,dlat=(Number(b.lat)-Number(a.lat))*Math.PI/180,dlon=(Number(b.lon)-Number(a.lon))*Math.PI/180,q=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;return R*2*Math.asin(Math.sqrt(q))}

function permutations(items){if(items.length===0)return[[]];return items.flatMap((x,i)=>permutations(items.filter((_,j)=>i!==j)).map(p=>[x,...p]))}
function routeScore(order){const points=[shop(),...order,shop()];return points.slice(1).reduce((a,p,i)=>a+hav(points[i],p),0)}
function orderedShots(){const remaining=state.shots.filter(s=>s.status!=='complete');const allGeo=coordsValid(shop())&&remaining.every(coordsValid);const mode=state.routeMode||'toward';if(remaining.length<2)return{order:remaining,allGeo,estimate:0};let order=[...remaining];const shortest=[...remaining].sort((a,b)=>feet(a)-feet(b));
if(!allGeo){if(mode==='short'||mode==='short_near'){let last=shortest[0];order=[...remaining.filter(s=>s.id!==last.id),last]}return{order,allGeo:false,estimate:null}}
if(mode==='toward')order.sort((a,b)=>hav(b,shop())-hav(a,shop()));
else if(mode==='short'||mode==='short_near'){
 const last=mode==='short'?shortest[0]:shortest.slice(0,Math.min(3,shortest.length)).sort((a,b)=>hav(a,shop())-hav(b,shop()))[0];const options=remaining.filter(s=>s.id!==last.id);if(options.length<=7){order=permutations(options).map(p=>[...p,last]).reduce((best,p)=>routeScore(p)<routeScore(best)?p:best,[...options,last])}else order=[...options.sort((a,b)=>hav(a,shop())-hav(b,shop())),last];
}else if(mode==='drive'){
 if(order.length<=7){order=permutations(order).reduce((best,p)=>routeScore(p)<routeScore(best)?p:best,order)}else{
 let cursor=shop(),pool=[...order];order=[];while(pool.length){pool.sort((a,b)=>hav(cursor,a)-hav(cursor,b));const next=pool.shift();order.push(next);cursor=next}
 }
}
return{order,allGeo:true,estimate:routeScore(order)}
}

 const all=[shop(),...order],ls=all.map(p=>Number(p.lat)),lon=all.map(p=>Number(p.lon)),minLat=Math.min(...ls),maxLat=Math.max(...ls),minLon=Math.min(...lon),maxLon=Math.max(...lon);const marginLat=Math.max(.004,(maxLat-minLat)*.15),marginLon=Math.max(.004,(maxLon-minLon)*.15);const x=p=>20+(Number(p.lon)-(minLon-marginLon))/(maxLon-minLon+2*marginLon)*320,y=p=>205-(Number(p.lat)-(minLat-marginLat))/(maxLat-minLat+2*marginLat)*180;const poly=all.map(p=>`${x(p)},${y(p)}`).join(' ')+' '+`${x(shop())},${y(shop())}`;

function shotForm(id){const s=state.shots.find(s=>s.id===id)||{name:`Shot ${String(state.shots.length+1).padStart(2,'0')}`,feet:'',address:'',lat:'',lon:'',notes:'',status:'planned'};const exists=!!s.id;showModal(`${modalHead(exists?'Edit Bore Shot':'New Bore Shot')}<form data-form="shot" data-id="${esc(id||'')}"><div class="form-grid"><label class="field wide">Shot name<input name="name" value="${esc(s.name)}" maxlength="70" required></label><label class="field">Length (feet)<input name="feet" type="number" step="0.1" min="0" value="${esc(s.feet)}" required></label><label class="field">Status<select name="status"><option value="planned" ${s.status==='planned'?'selected':''}>Pending</option><option value="progress" ${s.status==='progress'?'selected':''}>Drilling</option><option value="complete" ${s.status==='complete'?'selected':''}>Complete</option></select></label><label class="field wide">Jobsite address (optional)<input id="shotAddress" name="address" value="${esc(s.address)}" placeholder="Street address or nearby landmark"></label><label class="field">Latitude<input id="shotLat" name="lat" type="number" step="any" value="${esc(s.lat)}" placeholder="GPS latitude"></label><label class="field">Longitude<input id="shotLon" name="lon" type="number" step="any" value="${esc(s.lon)}" placeholder="GPS longitude"></label><label class="field wide">Notes<textarea name="notes" placeholder="Utility crossings, work notes, obstacles...">${esc(s.notes)}</textarea></label></div><div class="action-row"><button type="button" class="btn micro ghost" data-action="geocode-shot">⌖ Find GPS from address</button><button type="button" class="btn micro ghost" data-action="gps-shot">◉ Use my current GPS</button></div><div class="modal-footer"><button type="button" class="btn ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save Shot</button></div></form>${exists?`<div class="lightline"><button class="btn micro danger" data-action="delete-shot" data-id="${s.id}">Delete this shot</button></div>`:''}`)}
function shotDetail(id){const s=state.shots.find(s=>s.id===id);if(!s)return;const count=photos.filter(p=>p.shotId===id).length;showModal(`${modalHead(s.name)}<div class="card"><div class="between"><h2>${fmt(feet(s),1)} ft</h2><span class="status ${s.status==='complete'?'complete':s.status==='progress'?'progress':'planned'}">${s.status==='complete'?'Completed':s.status==='progress'?'Drilling':'Pending'}</span></div>${kv('Pipe allocation',`${fmt(pipeNeed(s),1)} ft (includes +${extra()} ft)`)}${kv('Location',esc(s.address||coordsText(s)||'No location set'))}${kv('Jobsite photos',count)}${s.completedAt?kv('Completed',esc(fullDate(s.completedAt))):''}${s.notes?`<div class="lightline smalltext">${esc(s.notes)}</div>`:''}</div><div class="action-row"><button class="btn primary" data-action="edit-shot" data-id="${s.id}">Edit Shot</button><button class="btn ghost" data-action="next-status" data-id="${s.id}">${s.status==='planned'?'Start Drilling':s.status==='progress'?'Mark Complete':'Reopen Shot'}</button><button class="btn ghost" data-action="capture-for-shot" data-id="${s.id}">▣ Photo</button></div><p class="tiny muted spaced">When you complete a shot, it updates the Job Board and daily report automatically.</p>`)}
function nowLocal(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function localDatetimeInput(value){if(!value)return nowLocal();const d=new Date(value);if(Number.isNaN(d.getTime()))return value;return nowLocal(d)}
function timeForm(id){const e=state.crew.find(e=>e.id===id)||{name:'',start:nowLocal(new Date(Date.now()-8*3600e3)),end:nowLocal(),lunch:automaticLunch(),notes:''};showModal(`${modalHead(id?'Edit Crew Time':'New Crew Time')}<form data-form="time" data-id="${esc(id||'')}"><label class="field">Crew member<input name="name" required maxlength="70" value="${esc(e.name)}" placeholder="Person's name" list="crewNames"></label><datalist id="crewNames">${state.roster.map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist><div class="form-grid"><label class="field">Clock in<input name="start" type="datetime-local" required value="${esc(localDatetimeInput(e.start))}"></label><label class="field">Clock out<input name="end" type="datetime-local" ${id&&!e.end?'':'required'} value="${id&&!e.end?'':esc(localDatetimeInput(e.end))}"></label></div><label class="field">Unpaid lunch (minutes)<input name="lunch" type="number" min="0" max="300" value="${esc(e.lunch)}"></label><label class="field">Notes<textarea name="notes">${esc(e.notes)}</textarea></label><div class="modal-footer"><button type="button" class="btn ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save Hours</button></div></form>${id?`<div class="lightline"><button class="btn micro danger" data-action="delete-time" data-id="${id}">Delete time entry</button></div>`:''}`)}
function photoChoose(kind,shotId){pendingPhotoKind=kind;pendingPhotoShot=shotId||'';if(!shotId&&state.shots.length){showModal(`${modalHead('Attach Photo to Shot')}<div class="field">Select bore shot<select id="photoShotPicker"><option value="">Unassigned / general job photo</option>${state.shots.map(s=>`<option value="${s.id}">${esc(s.name)} — ${feet(s)} ft</option>`).join('')}</select></div><div class="action-row"><button class="btn primary full" data-action="start-picked-photo">Continue to ${kind==='camera'?'Camera':'Gallery'}</button></div>`)}else {closeModal();$(kind==='camera'?'#cameraFile':'#galleryFile').click()}}
function startPickedPhoto(){pendingPhotoShot=$('#photoShotPicker')?.value||'';closeModal();$(pendingPhotoKind==='camera'?'#cameraFile':'#galleryFile').click()}
function photoDetail(id){const p=photos.find(p=>p.id===id);if(!p)return;const s=state.shots.find(s=>s.id===p.shotId);const hasLoc=p.lat!=null&&p.lon!=null;const coordinates=hasLoc?`${Number(p.lat).toFixed(6)}, ${Number(p.lon).toFixed(6)}`:'GPS unavailable';const address=s?.address||'';showModal(`${modalHead('Jobsite Photo')}<img src="${p.dataUrl}" alt="Captured site photo" class="photo-preview"><div class="card spaced">${kv('Shot',esc(s?.name||'General job photo'))}${kv(p.kind==='gallery'?'Added at':'Recorded at',esc(fullDate(p.addedAt)))}${kv('Address',esc(address||'No address provided'))}${kv('GPS',esc(coordinates))}${hasLoc?kv('Estimated accuracy',`${fmt(p.accuracy,1)} meters`):''}</div><div class="action-row">${hasLoc?`<a class="btn ghost" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${p.lat},${p.lon}`)}">Map coordinates</a>`:''}${hasLoc&&s&&!coordsValid(s)?`<button class="btn cyan" data-action="use-photo-gps" data-id="${p.id}">Use GPS for Shot</button>`:''}<button class="btn danger" data-action="delete-photo" data-id="${p.id}">Delete Photo</button></div>`)}
function getPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('GPS unavailable in this browser.'));navigator.geolocation.getCurrentPosition(pos=>resolve({lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy}),err=>reject(new Error(err.code===1?'Location permission denied.':'Unable to get GPS position.')),{enableHighAccuracy:true,timeout:13000,maximumAge:0})})}
async function gpsFill(target){try{notify('Requesting current GPS position…');const pos=await getPosition();const lat=$(`#${target}Lat`),lon=$(`#${target}Lon`);if(!lat||!lon)return;lat.value=pos.lat.toFixed(6);lon.value=pos.lon.toFixed(6);notify(`GPS captured (accuracy ±${Math.round(pos.accuracy)} m)`)}catch(err){notify(err.message+' Enter coordinates manually if needed.')}}
async function geocode(target){const addr=$(`#${target}Address`)?.value?.trim();if(!addr)return notify('Enter an address first.');if(Date.now()<geocodeWaitUntil)return notify('Try again in a moment (geocoder rate limit).');geocodeWaitUntil=Date.now()+1400;notify('Looking up the address…');try{const u=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(addr)}`;const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`lookup unavailable (${r.status})`);const results=await r.json();if(!results.length)return notify('No match found. Check the address or enter GPS coordinates.');$(`#${target}Lat`).value=Number(results[0].lat).toFixed(6);$(`#${target}Lon`).value=Number(results[0].lon).toFixed(6);notify('Found approximate coordinates. Check the pin before routing.')}catch(e){notify(`Online lookup unavailable: ${e.message}`)}}
async function compressImage(file){if(file.size>30*1024*1024)throw new Error('Image is too large (30 MB limit).');return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.76))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read image.'))};img.src=url})}
async function addPhoto(file){if(!file||!file.type.startsWith('image/'))return notify('Please select a photo file.');notify('Saving jobsite photo…');let pos=null;try{pos=await getPosition()}catch(e){console.info('Saving without GPS:',e.message)}try{const dataUrl=await compressImage(file);const rec={id:uid(),shotId:pendingPhotoShot||'',kind:pendingPhotoKind,addedAt:new Date().toISOString(),lat:pos?.lat??null,lon:pos?.lon??null,accuracy:pos?.accuracy??null,dataUrl};await photoDB('put',rec);await refreshPhotos();closeModal();setPage('photos');notify(pos?`Photo saved with GPS (±${Math.round(pos.accuracy)} m)`:'Photo saved without GPS. You can add shot coordinates manually.')}catch(e){notify('Photo could not be saved: '+e.message)}}
function safeFile(s){return String(s).replace(/[^a-z0-9-_]/gi,'_').slice(0,60)}
function downloadBlob(name,content,type){const blob=new Blob([content],{type});if(window.BoreLabNative?.saveBase64File){const reader=new FileReader();reader.onload=()=>{const base64=String(reader.result).split(',')[1];window.BoreLabNative.saveBase64File(name,type,base64)};reader.readAsDataURL(blob);return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function exportBackup(){try{await refreshPhotos();downloadBlob(`BoreLab_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({type:'borelab-backup',version:2,createdAt:new Date().toISOString(),state,photos},null,2),'application/json');notify('Backup downloaded — keep it somewhere safe.')}catch(e){notify('Could not export: '+e.message)}}
async function importBackup(file){try{const obj=JSON.parse(await file.text());if(obj.type!=='borelab-backup'||!obj.state||!Array.isArray(obj.state.shots)||!Array.isArray(obj.photos))throw new Error('This is not a valid BoreLab backup.');if(!confirm('Replace all current job data, photos and time entries with this backup?'))return;await photoDB('clear');for(const p of obj.photos){if(typeof p.dataUrl==='string'&&p.dataUrl.startsWith('data:image/'))await photoDB('put',p)}state=obj.state;if(!Array.isArray(state.roster))state.roster=[];if(!Array.isArray(state.selectedCrewIds))state.selectedCrewIds=[];save();await refreshPhotos();setPage('home');notify('Backup restored successfully.')}catch(e){notify(`Restore failed: ${e.message}`)}}
function reportCSS(){return `body{font:13px/1.5 system-ui,Arial;color:#152535;margin:28px auto;max-width:900px;padding:0 18px}h1{color:#df7d1f;border-bottom:3px solid #df7d1f;padding-bottom:12px}h2{margin-top:30px;background:#e8eff3;padding:8px 12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #acbbc5;padding:8px;text-align:left}th{background:#e8eff3}img{max-width:290px;max-height:220px;object-fit:cover;margin:8px 14px 8px 0}small{color:#516274}.print{padding:12px;background:#eee;border:0;border-radius:8px;cursor:pointer}@media print{.print{display:none}}`}
async function exportReport(){await refreshPhotos();const today=new Date().toISOString().slice(0,10);const rows=state.shots.map(s=>`<tr><td>${esc(s.name)}</td><td>${feet(s)}</td><td>${pipeNeed(s)}</td><td>${esc(s.status)}</td><td>${esc(s.address||coordsText(s)||'Not provided')}</td><td>${esc(s.notes||'')}</td></tr>`).join('');const crew=state.crew.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(fullDate(e.start))}</td><td>${e.end?esc(fullDate(e.end)):'Still checked in'}</td><td>${fmt(e.lunch)} min</td><td>${fmt(hours(e),2)}</td></tr>`).join('');const imageHTML=photos.map(p=>{const s=state.shots.find(s=>s.id===p.shotId);const loc=s?.address||(p.lat!=null?`${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`:'GPS unavailable');return `<div style="display:inline-block;vertical-align:top;width:310px;margin-bottom:12px;break-inside:avoid"><img src="${p.dataUrl}"><div><b>${esc(s?.name||'General job photo')}</b><br><small>${esc(fullDate(p.addedAt))}<br>${esc(loc)}</small></div></div>`}).join('');const html=`<!doctype html><html><head><meta charset="utf-8"><title>BoreLab · ${esc(state.jobName)}</title><style>${reportCSS()}</style></head><body><button class="print" onclick="window.print()">Print / Save as PDF</button><h1>BoreLab Field — Daily Report</h1><p><b>Job:</b> ${esc(state.jobName)}<br><b>Report created:</b> ${esc(fullDate(new Date().toISOString()))}<br><b>Shop:</b> ${esc(state.shopAddress||coordsText(shop())||'Not provided')}<br><b>Footage:</b> ${fmt(doneFeet())} / ${fmt(totalFeet())} ft completed<br><b>Estimated pipe allocations:</b> ${fmt(totalNeed())} ft, incl. +${fmt(extra())} ft per shot<br><b>Pipe on hand:</b> ${fmt(state.pipeAvailable)} ft</p><h2>Bore Log</h2><table><thead><tr><th>Shot</th><th>Feet</th><th>Pipe incl. extra</th><th>Status</th><th>Location</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table><h2>Crew Time Entries</h2><p>Saved roster: ${state.roster.map(x=>esc(x.name)).join(', ')||'None'}</p><table><thead><tr><th>Member</th><th>In</th><th>Out</th><th>Lunch</th><th>Hours</th></tr></thead><tbody>${crew}</tbody></table><p><b>Total crew-hours:</b> ${fmt(state.crew.reduce((a,e)=>a+hours(e),0),2)}</p><h2>Jobsite Photos</h2>${imageHTML||'<p>No photos added.</p>'}<p><small>Photo timestamps were recorded when added. GPS coordinates are included only when device location was available. Verify all field records before using for billing or compliance.</small></p></body></html>`;downloadBlob(`BoreLab_Report_${safeFile(state.jobName)}_${today}.html`,html,'text/html');notify('Report downloaded. Open it in your browser, then Print → Save as PDF.')}
function setShotStatus(id){const s=state.shots.find(x=>x.id===id);if(!s)return;s.status=s.status==='planned'?'progress':s.status==='progress'?'complete':'planned';s.completedAt=s.status==='complete'?new Date().toISOString():null;save();closeModal();render();notify(`${s.name} is now ${s.status==='complete'?'complete':s.status==='progress'?'in progress':'pending'}.`)}
async function resetData(demo){if(!confirm('This will replace ALL locally saved shots, photos and time entries. Continue?'))return;await photoDB('clear');state=seed();if(!demo){state.demo=false;state.shots=[];state.jobName='My HDD Job'}save();await refreshPhotos();setPage('home');notify(demo?'Demo reloaded.':'Fresh job created.')}
function saveShop(){state.shopAddress=$('#shopAddress').value.trim();state.shopLat=$('#shopLat').value.trim();state.shopLon=$('#shopLon').value.trim();save();render();notify('Shop location saved.')}
const getForm=(form)=>Object.fromEntries(new FormData(form).entries());
document.addEventListener('click',async event=>{const p=event.target.closest('[data-page]');if(p){setPage(p.dataset.page);return}const btn=event.target.closest('[data-action]');if(!btn)return;if(btn.dataset.action==='backdrop'&&event.target!==btn)return;const action=btn.dataset.action,id=btn.dataset.id;event.preventDefault();try{
switch(action){
 case 'backdrop':if(event.target===btn)closeModal();break;
 case 'close-modal':closeModal();break;
 case 'open-settings':case 'edit-job':setPage('settings');break;
 case 'save-job':state.jobName=$('#jobName').value.trim()||'My HDD Job';state.demo=false;save();notify('Job updated.');render();break;
 case 'new-shot':shotForm();break;
 case 'shot-detail':shotDetail(id);break;
 case 'edit-shot':shotForm(id);break;
 case 'next-status':setShotStatus(id);break;
 case 'delete-shot':if(confirm('Delete this shot? Its photos will remain saved as unassigned records.')){state.shots=state.shots.filter(s=>s.id!==id);for(const p of photos)if(p.shotId===id){p.shotId='';await photoDB('put',p)}state.demo=false;save();closeModal();render();notify('Shot deleted.')}break;
 case 'go-planner':setPage('planner');break;
 case 'go-photos':setPage('photos');break;
 case 'go-crew':setPage('crew');break;
 case 'roadmap':showModal(`${modalHead('Coming in the Next Build')}<p class="smalltext muted">Equipment garage, manufacturer manual indexing, and manufacturer-verified mud mixing are on the BoreLab roadmap. They are not functional in v0.1.</p>`);break;
 case 'route-mode':state.routeMode=btn.dataset.mode;save();render();break;
 case 'save-shop':saveShop();break;
 case 'gps-shop':gpsFill('shop');break;
 case 'gps-shot':gpsFill('shot');break;
 case 'geocode-shop':geocode('shop');break;
 case 'geocode-shot':geocode('shot');break;
 case 'choose-photo':photoChoose('camera');break;
 case 'choose-gallery':photoChoose('gallery');break;
 case 'capture-for-shot':photoChoose('camera',id);break;
 case 'start-picked-photo':startPickedPhoto();break;
 case 'photo-detail':photoDetail(id);break;
 case 'delete-photo':if(confirm('Permanently delete this photo from this device?')){await photoDB('delete',id);await refreshPhotos();closeModal();render();notify('Photo deleted.')}break;
 case 'use-photo-gps':{const p=photos.find(p=>p.id===id),s=state.shots.find(s=>s.id===p?.shotId);if(s&&p.lat!=null){s.lat=String(p.lat);s.lon=String(p.lon);save();closeModal();render();notify('Photo coordinates saved to shot.')}break}
 case 'manage-roster':manageRoster();break;
 case 'remove-person':{const person=state.roster.find(p=>p.id===id);if(person&&confirm(`Remove ${person.name} from the saved roster? Historical time entries remain.`)){state.roster=state.roster.filter(p=>p.id!==id);state.selectedCrewIds=state.selectedCrewIds.filter(p=>p!==id);save();manageRoster();notify('Member removed from roster.')}break}
 case 'check-in-crew':checkInCrew();break;
 case 'check-out-crew':checkoutForm();break;
 case 'new-time':timeForm();break;
 case 'edit-time':timeForm(id);break;
 case 'delete-time':if(confirm('Delete this time entry?')){state.crew=state.crew.filter(e=>e.id!==id);save();closeModal();render();notify('Time entry deleted.')}break;
 case 'export-report':await exportReport();break;
 case 'export-backup':await exportBackup();break;
 case 'import-backup':$('#importFile').click();break;
 case 'reset-demo':await resetData(true);break;
 case 'clear-demo':await resetData(false);break;
 default:break;
}
}catch(e){console.error(e);notify('Could not complete action: '+e.message)}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const values=getForm(form);if(form.dataset.form==='roster'){const names=String(values.names||'').split(/[\n,;]+/).map(n=>n.trim()).filter(Boolean);let count=0;for(const name of names){if(!state.roster.some(p=>p.name.toLowerCase()===name.toLowerCase())){const member={id:uid(),name:name.slice(0,70)};state.roster.push(member);state.selectedCrewIds.push(member.id);count++}}save();closeModal();render();notify(count?`Added ${count} crew member${count===1?'':'s'}. Selection saved.`:'Everyone listed is already in your roster.');
}else if(form.dataset.form==='checkout'){const now=new Date().toISOString();const active=state.crew.filter(e=>!e.end);for(const entry of active){const lunch=Number(values['lunch_'+entry.id]);entry.lunch=Number.isFinite(lunch)?Math.max(0,Math.min(300,lunch)):0;entry.end=now}save();closeModal();render();notify(`${active.length} crew member${active.length===1?'':'s'} checked out.`);
}else if(form.dataset.form==='shot'){
 const f=Number(values.feet);if(!Number.isFinite(f)||f<0)return notify('Enter a valid bore length.');const lat=values.lat.trim(),lon=values.lon.trim();if((lat!==''||lon!=='')&&!coordsValid({lat,lon}))return notify('Enter a valid latitude AND longitude, or leave both blank.');const id=form.dataset.id;const old=state.shots.find(s=>s.id===id),s={id:old?.id||uid(),name:values.name.trim(),feet:f,address:values.address.trim(),lat,lon,notes:values.notes.trim(),status:values.status,completedAt:values.status==='complete'?(old?.completedAt||new Date().toISOString()):null};if(old)state.shots=state.shots.map(x=>x.id===id?s:x);else state.shots.push(s);state.demo=false;save();closeModal();render();notify('Bore shot saved.');
}else if(form.dataset.form==='time'){
 const start=new Date(values.start),end=values.end?new Date(values.end):null;if(!Number.isFinite(start.getTime())||(end&&!(end>start)))return notify('Check the clock-in and clock-out times.');const id=form.dataset.id;const old=state.crew.find(x=>x.id===id);const matched=state.roster.find(p=>p.name.toLowerCase()===values.name.trim().toLowerCase());const entry={id:id||uid(),memberId:old?.memberId||matched?.id||null,name:values.name.trim(),start:values.start,end:values.end||'',lunch:Number(values.lunch)||0,notes:values.notes.trim()};if(id)state.crew=state.crew.map(x=>x.id===id?entry:x);else state.crew.push(entry);save();closeModal();render();notify('Crew time saved.');
}});
document.addEventListener('change',e=>{if(e.target.matches('[data-lunch-enabled]')){state.autoLunchEnabled=e.target.checked;save();render();notify(state.autoLunchEnabled?'Automatic lunch enabled.':'Automatic lunch disabled.');return}if(e.target.matches('[data-lunch-minutes]')){state.defaultLunchMinutes=Math.max(0,Math.min(300,Number(e.target.value)||0));save();render();notify('Lunch default saved.');return}if(e.target.matches('[data-roster-select]')){const id=e.target.dataset.rosterSelect;state.selectedCrewIds=e.target.checked?[...new Set([...state.selectedCrewIds,id])]:state.selectedCrewIds.filter(x=>x!==id);save();render();return}if(e.target.matches('[data-setting]')){const k=e.target.dataset.setting;state[k]=Math.max(0,Number(e.target.value)||0);save();render()}});
$('#cameraFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)await addPhoto(file);e.target.value=''});
$('#galleryFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)await addPhoto(file);e.target.value=''});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)await importBackup(file);e.target.value=''});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function init(){await refreshPhotos();render();if(!window.BoreLabNative&&'serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}}
init();
})();

</script>
</body>
</html>
