plugins {
    id 'com.android.application'
}

android {
    namespace 'com.borelab.field'
    compileSdk 35

    defaultConfig {
        applicationId 'com.borelab.field'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '0.7.1'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled, on-device Latin text recognition: works without Google Play Services or internet.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
