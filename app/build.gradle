plugins {
    id 'com.android.application'
}

android {
    namespace 'com.borelab.field'
    compileSdk 35

    defaultConfig {
        applicationId 'com.borelab.field'
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName '0.9.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled, on-device Latin text recognition: works without Google Play Services or internet.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.13.1'
    // Align older ML Kit Kotlin jdk7/jdk8 artifacts with AndroidX's Kotlin stdlib.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
