plugins {
    id 'com.android.application'
}

android {
    namespace 'com.borelab.field'
    compileSdk 35

    defaultConfig {
        applicationId 'com.borelab.field'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.5.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
