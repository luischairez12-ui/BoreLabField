/* v0.3 DAYLIGHT MODE — high contrast white/orange for outdoor HDD work. */
html[data-theme="daylight"]{
 --bg:#f4f7fa;--surface:#fff;--surface2:#edf3f7;--surface3:#e4edf4;--line:#c7d4df;
 --text:#142533;--muted:#526778;--accent:#db6700;--accent2:#a94a00;--cyan:#007e85;
 --mint:#067b5d;--danger:#b52e36;--shadow:0 6px 18px #17304814;color-scheme:light
}
html[data-theme="daylight"] body{background:#e8eef3;color:var(--text)}
html[data-theme="daylight"] .app-shell{background:linear-gradient(180deg,#fff,#f4f7fa 38%);box-shadow:0 0 36px #223c5115}
html[data-theme="daylight"] .topbar{background:#fffffff5;border-color:#c9d6df}
html[data-theme="daylight"] .brand small{color:#4c6271}
html[data-theme="daylight"] .bottom-nav{background:#fffffffa;border-top:1px solid #c5d3dd;box-shadow:0 -5px 20px #233d5116}
html[data-theme="daylight"] .nav-link{color:#455c6d}
html[data-theme="daylight"] .nav-link.active{color:#bb5100}
html[data-theme="daylight"] .new-shot-nav{border-color:#fff;box-shadow:0 4px 16px #c56b3061}
html[data-theme="daylight"] .icon-btn{background:#f4f7fa;border-color:#c4d3dd}
html[data-theme="daylight"] .eyebrow{color:#a94800}
html[data-theme="daylight"] .hero{background:linear-gradient(115deg,#17364acb,#10283feb),radial-gradient(circle at 70% 55%,#d9693280,transparent 40%);color:#fff;border-color:#3d6478}
html[data-theme="daylight"] .hero p{color:#e1edf3}
html[data-theme="daylight"] .hero .eyebrow{color:#ffc78e}
html[data-theme="daylight"] .tag{background:#e8eff3;color:#263f50;border-color:#bbcbd5}
html[data-theme="daylight"] .hero .tag{background:#244151;color:#f4f9fc;border-color:#547085}
html[data-theme="daylight"] .tag.teal{background:#d7f3f0;color:#006b67;border-color:#6ebfbb}
html[data-theme="daylight"] .status{background:#e8eef2;color:#263e4c;border-color:#bdd0dc;white-space:nowrap}
html[data-theme="daylight"] .status.complete{background:#d5f3e3;color:#0a6344;border-color:#86d7b1}
html[data-theme="daylight"] .status.progress{background:#fff0d4;color:#8f4a00;border-color:#e9b564}
html[data-theme="daylight"] .status.planned{color:#3a505e}
html[data-theme="daylight"] .card{background:#fff;border-color:#cfdae3;box-shadow:0 3px 12px #1d455012}
html[data-theme="daylight"] .stat{background:#f4f7fa;border-color:#d6e0e7}
html[data-theme="daylight"] .stat span{color:#4b6070}
html[data-theme="daylight"] .stat strong.teal{color:#007c7c}
html[data-theme="daylight"] .stat strong.orange{color:#c15b00}
html[data-theme="daylight"] .quick{background:#fff;border-color:#d1dce4}
html[data-theme="daylight"] .quick .qicon{color:#cf6300}
html[data-theme="daylight"] .shot{background:#fff;border-color:#d1dce4}
html[data-theme="daylight"] .shot .shot-icon{background:#fff0df;color:#c75a00}
html[data-theme="daylight"] .shot .foot{color:#00757c}
html[data-theme="daylight"] .shot-actions button{color:#355569}
html[data-theme="daylight"] .progress{background:#dde8ef}
html[data-theme="daylight"] .progress>div{background:linear-gradient(90deg,#f5a12e,#e57908)}
html[data-theme="daylight"] .btn{background:#f2f6f9;border-color:#b7cbd7;color:#173042}
html[data-theme="daylight"] .btn.primary{color:#fff;border-color:#d46b0a;background:linear-gradient(135deg,#f28b1d,#c85700)}
html[data-theme="daylight"] .btn.cyan{background:#007e84;border-color:#006b70;color:#fff}
html[data-theme="daylight"] .btn.ghost{background:#fff}
html[data-theme="daylight"] .btn.danger{background:#fff1f1;color:#a72831;border-color:#d6a0a4}
html[data-theme="daylight"] .note{background:#fff5df;border-color:#e0c27e;color:#695017}
html[data-theme="daylight"] .note.good{background:#e8f7ed;border-color:#9acbac;color:#175f43}
html[data-theme="daylight"] .note.error{background:#fff1f1;border-color:#d2a1a5;color:#982a33}
html[data-theme="daylight"] .field{color:#314b5d}
html[data-theme="daylight"] .field input,
html[data-theme="daylight"] .field select,
html[data-theme="daylight"] .field textarea{background:#fff;color:#182e3f;border-color:#b8ccd8}
html[data-theme="daylight"] .field input:focus,
html[data-theme="daylight"] .field select:focus,
html[data-theme="daylight"] .field textarea:focus{border-color:#d77207;box-shadow:0 0 0 2px #f3a54b50}
html[data-theme="daylight"] .chip{background:#f1f6fa;border-color:#c8d7e0;color:#314c5e}

html[data-theme="daylight"] .photo-tile{background:#fff;border-color:#c3d3dd;color:#142c3b}
html[data-theme="daylight"] .photo-tile img{background:#e5edf2}

html[data-theme="daylight"] .crew-pick{background:#f7fafc;border-color:#c8d8e1}

html[data-theme="daylight"] .footer-note{color:#5f7586}

@media(max-width:420px){
 .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
 .table-wrap table{min-width:420px}
 .status{font-size:10px;padding:4px 6px}
}


/* v0.3.1 phone clarity: ensure status pills and actions are never clipped. */
.status.progress{height:auto;min-height:0;width:auto;overflow:visible;display:inline-flex;align-items:center;line-height:1.3;white-space:nowrap}
.card-head>div:first-child{min-width:0;flex:1}
.card-head>div:first-child h2{overflow-wrap:anywhere}
.card-head>.status{flex-shrink:0;margin-left:6px;align-self:center}
.crew-entries{padding:5px 14px}
.crew-entry{padding:13px 2px;border-bottom:1px solid var(--line);min-width:0}
.crew-entry:last-child{border-bottom:0}
.crew-entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.crew-entry-head .person{min-width:0;overflow-wrap:anywhere}
.crew-entry-head .person strong{display:block;font-size:14px}
.crew-entry-head .person small{display:block;margin-top:3px;font-size:11px}
.crew-entry-head .status{font-size:10px;flex-shrink:0;padding:5px 9px}
.crew-entry-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;min-width:0}

<script>

(() => {
'use strict';
const KEY='borelab-field-v0.1'; // retain existing data key across upgrades
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const seed=()=>({version:1,demo:true,jobName:'Demo Job · South Glades',allowance:10,pipeAvailable:345,shopName:'',shopAddress:'',shopLat:'',shopLon:'',routeMode:'toward',shotDurationRate:45,setupMinutes:25,roster:[],selectedCrewIds:[],equipment:[],reels:[],pipeMoves:[],pipeReservations:[],history:[],manualLinks:[],uxMode:'simple',fieldMode:false,largeText:false,uxFavorites:['new-shot','go-photos','go-mud','go-manuals','go-pipe','go-crew'],mudProducts:[],mudSelectedIds:[],mudLogs:[],mudStockMoves:[],mudTank:{capacity:'',currentGallons:'0',targetGallons:'',mode:'topoff',soil:'unknown',notes:''},reportScope:'today',shots:[{id:uid(),name:'Shot 01',feet:175,address:'',lat:'',lon:'',notes:'',status:'complete',completedAt:new Date().toISOString()},{id:uid(),name:'Shot 02',feet:155,address:'',lat:'',lon:'',notes:'',status:'planned'},{id:uid(),name:'Shot 03',feet:90,address:'',lat:'',lon:'',notes:'',status:'planned'},{id:uid(),name:'Shot 04',feet:80,address:'',lat:'',lon:'',notes:'',status:'planned'}],crew:[]});

try{const s=JSON.parse(localStorage.getItem(KEY)||'null');state=s&&Array.isArray(s.shots)?s:seed()}catch{state=seed()}
if(!Array.isArray(state.roster))state.roster=[];
if(!Array.isArray(state.equipment))state.equipment=[];
if(!Array.isArray(state.reels))state.reels=[];
if(!Array.isArray(state.pipeMoves))state.pipeMoves=[];

if(!Array.isArray(state.pipeReservations))state.pipeReservations=[];
if(!Array.isArray(state.history))state.history=[];if(!Array.isArray(state.manualLinks))state.manualLinks=[];
if(!Array.isArray(state.mudProducts))state.mudProducts=[];
if(!Array.isArray(state.mudSelectedIds))state.mudSelectedIds=[];
if(!Array.isArray(state.mudLogs))state.mudLogs=[];
if(!Array.isArray(state.mudStockMoves))state.mudStockMoves=[];

state.defaultLunchMinutes=Math.max(0,Math.min(300,Number(state.defaultLunchMinutes)));

if(!state.uxFavorites.length)state.uxFavorites=['new-shot','go-photos','go-mud','go-manuals','go-pipe','go-crew'];

/* The old active-job fields remain a compatibility view. Each saved job stores its

   stock and crew roster intentionally stay in the top-level field inventory. */
const JOB_FIELDS=['jobName','jobAddress','jobNotes','shots','crew','allowance','routeMode','demo'];
function makeJobSnapshot(id,fields){
 return {id,createdAt:new Date().toISOString(),archived:false,
   jobName:String(fields.jobName||'New Job').slice(0,90),
   jobAddress:String(fields.jobAddress||'').slice(0,250),
   jobNotes:String(fields.jobNotes||'').slice(0,2000),
   shots:Array.isArray(fields.shots)?fields.shots:[],
   crew:Array.isArray(fields.crew)?fields.crew:[],
   allowance:Number.isFinite(Number(fields.allowance))?Number(fields.allowance):10,
   routeMode:typeof fields.routeMode==='string'?fields.routeMode:'toward',
   demo:fields.demo===true};
}
function initializeJobs(){
 if(!Array.isArray(state.jobs)||!state.jobs.length){
  const id=uid();
  state.jobs=[makeJobSnapshot(id,state)];

  state.legacyJobId=id;
 }else{

   .map(j=>({...makeJobSnapshot(j.id,j),...j,shots:Array.isArray(j.shots)?j.shots:[],crew:Array.isArray(j.crew)?j.crew:[]}));
  if(!state.jobs.length){const id=uid();state.jobs=[makeJobSnapshot(id,state)];state.activeJobId=id;}
  if(!state.jobs.some(j=>j.id===state.activeJobId))state.activeJobId=state.jobs[0].id;
  if(!state.legacyJobId)state.legacyJobId=state.jobs[0].id;
 }
 hydrateJob(state.jobs.find(j=>j.id===state.activeJobId));
}

function hydrateJob(job){if(!job)return;for(const key of JOB_FIELDS)state[key]=job[key];}
function syncActiveJob(){
 const job=activeJob();if(!job)return;
 for(const key of JOB_FIELDS)job[key]=state[key];
 job.lastTouchedAt=new Date().toISOString();
}
function jobIdOfRecord(record){return record?.jobId||state.legacyJobId||state.activeJobId}
function belongsToJob(record,id=state.activeJobId){return jobIdOfRecord(record)===id}
function activeJobPhotos(){return photos.filter(p=>belongsToJob(p))}
function jobDisplayName(job){return String(job?.jobName||'Unnamed job')}

initializeJobs();
let page=['home','job','jobs','dayassist','planner','fieldhistory','studio','pipe','mud','mudstock','manuals','photos','crew','closeout','history','settings','tools','search','command','shotcards','reelplan','photosmart','recovery','scan3','crewmanager2','fieldintelligence3','equipmentmanager2','tomorrowplanner','crewpreview','supervisorpreview','localaccounts'].includes(state.lastScreen)?state.lastScreen:'home',modal='',photos=[],pendingPhotoShot='',pendingPhotoKind='camera',pendingPhotoStage='',pendingPhotoJobId='',pendingPhotoFieldPinId='',geocodeWaitUntil=0,toastTimeout;

if(typeof state.jobAddress!=='string')state.jobAddress='';

const BORELAB_PAGES=new Set(['home','job','jobs','dayassist','dayassistlegacy','phototimeline2','shotboard','planner','fieldhistory','pipe','mud','mudstock','manuals','photos','crew','closeout','history','settings','tools','search','command','shotcards','reelplan','photosmart','recovery','scan3','jobmap','dayassistlegacy','phototimeline2','crewmanager2','fieldintelligence3','equipmentmanager2','tomorrowplanner','crewpreview','supervisorpreview','localaccounts','fieldhub','fieldproductivity','reelcommand','crossings','companion','studio']);

function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('borelab-photos-v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function photoDB(op,arg){const database=await db();return new Promise((resolve,reject)=>{const tx=database.transaction('photos',op==='list'?'readonly':'readwrite');const store=tx.objectStore('photos');let request;if(op==='list')request=store.getAll();if(op==='put')request=store.put(arg);if(op==='delete')request=store.delete(arg);if(op==='clear')request=store.clear();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);tx.oncomplete=()=>database.close();tx.onerror=()=>reject(tx.error)})}
async function refreshPhotos(){try{photos=(await photoDB('list')).sort((a,b)=>String(b.addedAt||'').localeCompare(String(a.addedAt||'')))}catch(e){console.warn('Photo storage unavailable:',e);photos=[]}}

function switchActiveJob(id){
 if(!state.jobs.some(j=>j.id===id)){notify('Job not found.');return false;}
 if(id===state.activeJobId){setPage('job');return true;}
 flushPendingDraft();closeModal();syncActiveJob();
 const current=activeJob(),other=state.jobs.find(j=>j.id===id);
 if(!other)return false;
 const stillIn=current.crew.filter(e=>!e.end);
 if(stillIn.length&&!confirm(stillIn.length+' crew time entry/entries are still open on '+current.jobName+
  '. Switching jobs will NOT check them out or move those hours. Continue?'))return false;
 state.activeJobId=id;hydrateJob(other);attemptedAutoAddressLookup=false;
 // Keep independent bores, notes and crew entries. Shared pipe reels/stock stay available.
 save();screenStack=[];try{sessionStorage.removeItem('borelab-screen-stack-v1')}catch{}
 setPage('job',{back:true});notify('Switched to '+state.jobName);return true;
}

  shots:[],crew:[],allowance:state.allowance,routeMode:state.routeMode,demo:false});

}

 page=p;state.lastScreen=p;save();
 try{sessionStorage.setItem('borelab-screen-stack-v1',JSON.stringify(screenStack))}catch{}

function borelabGoBack(){

 if(window.BoreLabFab?.isOpen?.()){window.BoreLabFab.close();return true}
 if(window.BoreLabNavigation?.isOpen?.()){window.BoreLabNavigation.close();return true}
 if(window.BoreLabLocalAccounts?.isConfigured?.()&&
   ['crew','supervisor'].includes(window.BoreLabLocalAccounts?.role?.())){
  window.BoreLabLocalAccounts.lock();return true;

}

function highlightManualTerm(snippet,query){
 const text=String(snippet||''),term=String(query||'');
 const i=text.toLocaleLowerCase().indexOf(term.toLocaleLowerCase());
 if(i<0||!term)return esc(text);
 return esc(text.slice(0,i))+'<mark class="manual-highlight">'+esc(text.slice(i,i+term.length))+'</mark>'+esc(text.slice(i+term.length));
}
function showManualSearch(slot,query='',payload=null,pending=false){
 if(!isManualSlot(slot)||manualFiles[slot]!==true)return notify('Import the PDF before searching.');
 const machine=MANUAL_MACHINES.find(m=>MANUAL_TYPES.some(([type])=>manualSlot(m.id,type)===slot));
 const type=machine?slot.slice(machine.id.length+1):'manual';
 const label=MANUAL_TYPES.find(([id])=>id===type)?.[1]||'Manual';
 const title=(machine?machine.make+' '+machine.model+' · ':'')+label;
 const matches=Array.isArray(payload?.results)?payload.results:[];
 const status=pending?'<div class="note spaced">Searching downloaded PDF text offline... Large manuals may take longer.</div>':
  payload?.error?'<div class="note spaced">'+esc(payload.error)+'</div>':
  payload?matches.length?
   '<p class="smalltext muted spaced">Found matching text on '+matches.length+' page(s). Examined '+Number(payload.searchedPages||0)+' of '+Number(payload.pageCount||0)+' PDF pages.</p>':
   Number(payload.textPages||0)===0?
    '<div class="note spaced">No selectable text found. This manual may contain scanned page images. OCR search is not yet supported; open the PDF normally for now.</div>':
    '<div class="note spaced">No exact matches. Try a shorter keyword, part name, or fault-code number.</div>':
  '<p class="tiny muted spaced">Search the actual words in this PDF, such as hydraulic pressure, rotation, pump, or fault codes.</p>';
 const rows=matches.map(hit=>{
  const page=Number(hit.page);
  if(!Number.isInteger(page)||page<1)return '';
  return '<div class="manual-search-result"><div class="between"><strong>PDF page '+page+'</strong>'+
   '<button type="button" class="btn micro primary" data-action="manual-open-page" data-id="'+esc(slot)+'" data-manual-page="'+page+'">View page</button></div>'+
   '<p class="smalltext muted spaced">'+highlightManualTerm(hit.snippet,query)+'</p></div>';
 }).join('');
 const limit=payload?.truncated?'<p class="tiny muted spaced">Showing up to 100 matching pages and searching up to 900 PDF pages. Try a narrower query if you need a shorter list.</p>':'';
 showModal(modalHead('Search Manual')+
  '<p class="smalltext muted">'+esc(title)+'</p>'+
  '<form data-form="manual-search" data-slot="'+esc(slot)+'">'+
  '<label class="field spaced">Search keyword or phrase<input type="search" name="query" maxlength="80" minlength="2" required placeholder="Example: rotation pressure" value="'+esc(query)+'"></label>'+
  '<div class="action-row"><button class="btn primary" type="submit" '+(pending?'disabled':'')+'>⌕ Search PDF</button>'+
  '<button class="btn ghost" type="button" data-action="close-modal">Close</button></div></form>'+
  status+rows+limit+
  '<p class="tiny muted spaced">PDF page numbers count cover pages. Check machine model/serial number and the complete safety procedure before following a manual.</p>');
}

function manualLinkUrl(raw){
 const rawText=String(raw||'').trim();
 if(rawText.length>1800)throw Error('URL is too long.');
 let url;
 try{url=new URL(rawText)}catch{throw Error('Paste a complete https:// web address.')}
 const host=url.hostname.toLowerCase();
 if(url.protocol!=='https:'||!host.includes('.')||url.username||url.password||
   host==='appassets.androidplatform.net'||host==='localhost'||host.endsWith('.localhost')||
   /^\d+\.\d+\.\d+\.\d+$/.test(host)||host.startsWith('['))
   throw Error('Use a public HTTPS manual link.');
 return url.href;
}
function manualExternalUrl(url){
 try{
  const address=manualLinkUrl(url);
  if(window.BoreLabNative?.openUserManualLink)window.BoreLabNative.openUserManualLink(address);
  else window.location.assign(address);
 }catch(e){notify(e.message)}
}

function saveManualLink(values,id=''){
 if(!Array.isArray(state.manualLinks))state.manualLinks=[];
 const prev=state.manualLinks.find(x=>x?.id===id);
 if(state.manualLinks.length>=100&&!prev)return notify('Limit of 100 personal links reached.');
 const machineId=String(values.machineId||''),type=String(values.type||''),
  label=String(values.label||'').trim().slice(0,90),note=String(values.note||'').trim().slice(0,180);
 if(!MANUAL_MACHINES.some(m=>m.id===machineId)||!MANUAL_TYPES.some(x=>x[0]===type)||!label)
  return notify('Choose a rig, type, and link name.');
 let url;
 try{url=manualLinkUrl(values.url)}catch(e){return notify(e.message)}
 if(state.manualLinks.some(x=>x?.id!==prev?.id&&x.machineId===machineId&&x.type===type&&x.url===url))
  return notify('This manual URL is already saved for that rig and type.');
 const link={id:prev?.id||uid(),machineId,type,label,url,note,createdAt:prev?.createdAt||new Date().toISOString()};
 if(prev)state.manualLinks=state.manualLinks.map(x=>x.id===prev.id?link:x);
 else state.manualLinks.push(link);
 selectedManualMachine=machineId;save();closeModal();render();notify('Your manual link was saved.');
}

}

 if(!Number.isFinite(n)||!Number.isFinite(scale[from])||!Number.isFinite(scale[to])||!mudUnitFamily(from)||mudUnitFamily(from)!==mudUnitFamily(to))return null;

function calculateMud(t=mudConfig(),selected=state.mudSelectedIds){
 const raw=(v)=>String(v??'').trim();
 const capacity=Number(t.capacity),current=Number(t.currentGallons),target=Number(t.targetGallons);
 if(!raw(t.capacity)||!Number.isFinite(capacity)||capacity<=0)return{ok:false,error:'Enter a valid tank capacity in gallons.'};
 if(!raw(t.currentGallons)||!Number.isFinite(current)||current<0)return{ok:false,error:'Enter current gallons (0 if empty).'};
 if(!raw(t.targetGallons)||!Number.isFinite(target)||target<=0)return{ok:false,error:'Enter the desired final tank level.'};
 if(current>capacity||target>capacity)return{ok:false,error:'The current or target level exceeds tank capacity.'};
 if(target<current)return{ok:false,error:'Target level cannot be below the current tank level.'};
 if(t.mode==='fresh'&&current>0)return{ok:false,error:'Fresh batch requires an empty tank. Use top-off for an existing mixture.'};
 const added=Math.round((target-current)*1000)/1000;
 if(!added)return{ok:false,error:'No new water to mix. Increase the target level or update the current tank level.'};
 const doseBasis=t.mode==='fresh'?target:added;
 const products=selected.map(id=>state.mudProducts.find(x=>x.id===id&&!x.archived&&mudProductReady(x))).filter(Boolean).map(p=>({
  id:p.id,name:p.name,unit:p.unit,rate:Number(p.rate),perGallons:Number(p.perGallons),
  manufacturer:p.manufacturer||'',source:p.source||'',instructions:p.instructions||'',
  dose:doseBasis*Number(p.rate)/Number(p.perGallons)
 }));
 if(products.some(p=>!Number.isFinite(p.dose)||p.rate<=0||p.perGallons<=0))return{ok:false,error:'One of the selected products has an invalid rate.'};
 return{ok:true,capacity,current,target,added,doseBasis,products,mode:t.mode,soil:t.soil||'unknown'};
}
function guessMudProductName(text){
 const skip=/\b(warning|caution|keep out|danger|first aid|ingredients|directions|net wt|net weight|safety data|made in|batch no|lot no|www\.|telephone|storage|application rate|mixing instructions)\b/i;
 const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const possible=lines.find(x=>x.length>=3&&x.length<=85&&!skip.test(x)&&/[a-zA-Z]{3}/.test(x)&&!/^\d/.test(x));
 return (possible||'').slice(0,100);
}

function imageResizedJpeg(image,maxDimension,quality){
 const scale=Math.min(1,maxDimension/Math.max(image.naturalWidth||image.width,image.naturalHeight||image.height));
 const width=Math.max(1,Math.round((image.naturalWidth||image.width)*scale));
 const height=Math.max(1,Math.round((image.naturalHeight||image.height)*scale));
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d');
 if(!ctx)throw Error('Image processing is unavailable.');
 ctx.drawImage(image,0,0,width,height);
 return canvas.toDataURL('image/jpeg',quality);
}

function saveMudProduct(form,values){
 const name=String(values.name||'').trim(),unit=String(values.unit||'').trim();
 const units=['lb','oz (weight)','fl oz','qt','gal','kg','L','mL','bags'];
 const id=form.dataset.id,existing=state.mudProducts.find(p=>p.id===id);
 const scan=!existing?pendingMudScan:null;
 const photo=existing?.labelPhoto||scan?.photo||'';
 const text=existing?.labelText||scan?.text||'';
 const scanned=!!photo;
 const rateRaw=String(values.rate??'').trim(),perRaw=String(values.perGallons??'').trim();
 const rate=rateRaw===''?'':Number(rateRaw),perGallons=perRaw===''?'':Number(perRaw);
 if(!name||!units.includes(unit))return notify('Enter the product name and choose its dose units.');
 if(rate!==''&&(!Number.isFinite(rate)||rate<=0))return notify('Dose must be a positive number.');
 if(perGallons!==''&&(!Number.isFinite(perGallons)||perGallons<=0))return notify('Gallons must be a positive number.');
 if(!scanned&&(rate===''||perGallons===''))return notify('Manually entered products require a complete dose and gallons.');
 const verified=!scanned||values.verifiedRate==='yes';
 if(scanned&&verified&&(rate===''||perGallons===''))return notify('Enter the confirmed rate and gallons before checking verified.');
 let stockQty=existing?.stockQty,packageUnit=existing?.packageUnit,packageSize=existing?.packageSize;
 if(existing?.stockTracked===true&&existing.unit!==unit){
  const converted=convertMudQty(Number(stockQty),existing.unit,unit);
  if(converted===null){
   if(Number(stockQty)>0)return notify('Cannot change to an incompatible unit while product inventory remains. Remove or recount your existing stock first.');
   stockQty=0;packageSize='';packageUnit=unit;
  }else stockQty=mudRound(converted);
 }
 const product={...existing,id:existing?.id||uid(),name:name.slice(0,100),
  manufacturer:String(values.manufacturer||'').trim().slice(0,100),
  rate,unit,perGallons,stockQty,packageUnit,packageSize,
  source:String(values.source||'').trim().slice(0,220),instructions:String(values.instructions||'').trim().slice(0,2000),
  labelPhoto:photo,labelText:text.slice(0,9000),scannedAt:existing?.scannedAt||scan?.at||'',
  rateVerified:verified,archived:false};
 if(existing)state.mudProducts=state.mudProducts.map(p=>p.id===id?product:p);
 else state.mudProducts.push(product);
 if(mudProductReady(product)){
  if(!state.mudSelectedIds.includes(product.id))state.mudSelectedIds.push(product.id);
 }else state.mudSelectedIds=state.mudSelectedIds.filter(x=>x!==product.id);
 pendingMudScan=null;
 save();closeModal();render();
 notify(mudProductReady(product)?'Product saved and ready to select in MixLab.':'Scanned product saved in MixLab. Tap Add Rate later to enable calculations.');
}
function saveMudPlan(form,values,record=false){
 const level=mudLevelInputValues(values);
 const target=mudLevelInputValues({capacity:values.capacity,levelChoice:values.targetLevelChoice==='empty'?'custom':values.targetLevelChoice,currentGallons:values.targetGallons});
 const config={
  capacity:String(values.capacity??'').trim(),currentGallons:level.currentGallons,levelChoice:level.levelChoice,
  targetGallons:target.currentGallons,targetLevelChoice:target.levelChoice,mode:values.mode==='fresh'?'fresh':'topoff',
  soil:['unknown','sand','clay','mixed','rock','other'].includes(values.soil)?values.soil:'unknown',
  notes:String(values.notes||'').trim().slice(0,1000),
  lastMixId:state.mudTank?.lastMixId||'',
  contentsStatus:state.mudTank?.contentsStatus||'unknown'
 };
 const ids=[...form.querySelectorAll('input[name="mudSelected"]:checked')].map(input=>input.value)
  .filter(id=>state.mudProducts.some(p=>p.id===id&&!p.archived&&mudProductReady(p)));
 const plan=calculateMud(config,ids);
 if(!plan.ok)return notify(plan.error);
 if(record&&!plan.products.length)return notify('Select at least one saved product before recording a mixed batch.');
 const assessment=mudStockAssessment(plan);
 if(record){
  const shortage=assessment.filter(a=>a.status==='short');
  if(shortage.length)return notify('Not enough tracked stock: '+shortage.map(a=>a.name+' (short '+fmt(Math.abs(a.remaining),3)+' '+a.unit+')').join('; ')+'. Update inventory first.');
  const unknown=assessment.filter(a=>a.status==='untracked');
  const warning=unknown.length?'\n\nStock is not tracked for: '+unknown.map(a=>a.name).join(', ')+'. Those products will NOT be deducted from inventory.':'';
  if(!confirm(`Record ${fmt(plan.added,2)} gallons of water and ${plan.products.length} products as actually mixed? This will deduct tracked product stock and set tank level to ${fmt(plan.target,2)} gallons.${warning}`))return;
  const at=new Date().toISOString(),batchId=uid();
  const stockUsed=[];
  for(const item of assessment){
   if(item.available==null)continue;
   const p=state.mudProducts.find(x=>x.id===item.id);
   if(!p)continue;
   const before=Number(p.stockQty),after=mudRound(Math.max(0,before-item.required));
   p.stockQty=after;
   state.mudStockMoves.push({id:uid(),at,jobId:state.activeJobId,kind:'mix',batchId,productId:p.id,productName:p.name,unit:p.unit,
    before,after,delta:mudRound(after-before),note:'Automatically deducted when actual mud mix was recorded'});
   stockUsed.push({productId:p.id,name:p.name,unit:p.unit,amount:mudRound(item.required),remaining:after});
  }
  state.mudLogs.push({id:batchId,at,jobId:state.activeJobId,jobName:state.jobName,capacity:plan.capacity,before:plan.current,
    target:plan.target,added:plan.added,mode:plan.mode,soil:config.soil,
    products:JSON.parse(JSON.stringify(plan.products)),stockUsed,untrackedProducts:unknown.map(x=>x.name),
    notes:config.notes});
  config.lastMixId=batchId;
  config.contentsStatus=plan.mode==='fresh'?'recorded':state.mudTank?.contentsStatus==='recorded'?'recorded':'unverified';
  config.currentGallons=String(plan.target);
  config.targetGallons=String(plan.target);
  config.levelChoice='custom'; // Final volume logged, not the old estimated fraction.
  config.targetLevelChoice='custom'; // Recorded volume is no longer just an estimated target.
 }
 if(typeof clearFormDraft==='function')clearFormDraft(form);state.mudTank=config;state.mudSelectedIds=ids;save();render();
 notify(record?'Mix recorded. Tracked product stock and tank contents updated.':'Mix plan saved. Previewing never changes inventory.');
}
function saveMudLevel(values){
 const tank=mudConfig(),capacity=Number(tank.capacity);
 const level=mudLevelInputValues({...values,capacity:tank.capacity});
 const raw=String(level.currentGallons??'').trim(),g=Number(raw);
 if(!Number.isFinite(capacity)||capacity<=0)return notify('Enter and save tank capacity in MixLab first.');
 if(!raw||!Number.isFinite(g)||g<0||g>capacity)return notify('Select a tank fraction or enter gallons between zero and tank capacity.');
 const previous=Number(tank.currentGallons)||0;
 const changed=Math.abs(g-previous)>0.00001;
 const contentsStatus=g===0?'empty':
   changed&&g>previous?'unknown':
   changed?'adjusted':(tank.contentsStatus||'unknown');
 state.mudTank={...tank,levelChoice:level.levelChoice,currentGallons:String(g),
   targetGallons:String(Math.max(g,Math.min(capacity,Number(tank.targetGallons)||g))),contentsStatus,lastMixId:g===0?'':(tank.lastMixId||'')};
 save();closeModal();render();
 notify(level.levelChoice==='custom'?'Current tank gallons updated.':'Approximate tank level saved: '+g+' gal.');
}

function jobDayIssues(job,day){
 const r=jobRecordsForDay(job,day);
 const issues=[];
 const unclosed=(job.crew||[]).filter(e=>!e.end&&localDay(e.start)<=day).length;
 if(unclosed)issues.push(unclosed+' crew member(s) still clocked in');
 const drilling=(job.shots||[]).filter(sh=>sh.status==='progress').length;
 if(drilling)issues.push(drilling+' bore(s) still in progress — carry over, do not auto-complete');
 const missing=r.shots.filter(sh=>sh.status==='complete'&&
  !r.pipe.some(m=>m.type==='installed'&&m.shotId===sh.id)&&
  (sh.pipeUsed==null||sh.pipeUsed==='')).length;
 if(missing)issues.push(missing+' completed bore(s) missing recorded pipe');
 if(typeof window!=='undefined'&&window.BoreLabFieldOps)issues.push(...window.BoreLabFieldOps.dayWarnings(job,day));
 return [...new Set(issues)];
}

 };

function coordsValid(o){return o&&o.lat!==''&&o.lon!==''&&o.lat!=null&&o.lon!=null&&Number.isFinite(Number(o.lat))&&Number.isFinite(Number(o.lon))&&Math.abs(Number(o.lat))<=90&&Math.abs(Number(o.lon))<=180}
function coordsText(s){return coordsValid(s)?`${Number(s.lat).toFixed(5)}, ${Number(s.lon).toFixed(5)}`:''}
function hav(a,b){if(!coordsValid(a)||!coordsValid(b))return NaN;const R=3958.7613,lat1=Number(a.lat)*Math.PI/180,lat2=Number(b.lat)*Math.PI/180,dlat=(Number(b.lat)-Number(a.lat))*Math.PI/180,dlon=(Number(b.lon)-Number(a.lon))*Math.PI/180,q=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;return R*2*Math.asin(Math.sqrt(q))}
function shop(){return{lat:state.shopLat,lon:state.shopLon}}
function permutations(items){if(items.length===0)return[[]];return items.flatMap((x,i)=>permutations(items.filter((_,j)=>i!==j)).map(p=>[x,...p]))}
function routeScore(order){const points=[shop(),...order,shop()];return points.slice(1).reduce((a,p,i)=>a+hav(points[i],p),0)}
function orderedShots(){
 const pending=state.shots.filter(s=>s.status!=='complete');
 const mode=state.routeMode||'toward';
 const homeReady=coordsValid(shop());
 const known=pending.filter(coordsValid),unknown=pending.filter(s=>!coordsValid(s));
 const allGeo=homeReady&&unknown.length===0;
 const minFeet=pending.length?Math.min(...pending.map(feet)):0;
 const choices=pending.filter(s=>feet(s)===minFeet);
 const modeNames={toward:'Far away → toward shop',short:'Shortest shot last',drive:'Least total distance',short_near:'Short shot near shop last'};
 const modeName=modeNames[mode]||modeNames.toward;
 let order=[...pending],message='',usable=false,finalShot=null;
 function scoreRoute(list,returnShop){
   if(list.length===0)return 0;
   let miles=0;
   if(returnShop&&homeReady)miles+=hav(shop(),list[0]);
   for(let i=1;i<list.length;i++)miles+=hav(list[i-1],list[i]);
   if(returnShop&&homeReady)miles+=hav(list[list.length-1],shop());
   return miles;
 }
 function optimalOrder(items,returnShop){
   if(items.length<2)return [...items];
   if(items.length<=7){
     const variants=permutations(items);
     return variants.reduce((best,p)=>scoreRoute(p,returnShop)<scoreRoute(best,returnShop)-1e-9?p:best,variants[0]);
   }
   // Large shot lists: nearest-neighbor approximation instead of factorial search.
   let rest=[...items],out=[],cursor=returnShop&&homeReady?shop():null;
   if(!cursor){const first=rest.shift();out.push(first);cursor=first}
   while(rest.length){
     rest.sort((a,b)=>hav(cursor,a)-hav(cursor,b));
     const next=rest.shift();out.push(next);cursor=next;
   }
   return out;
 }
 if(mode==='toward'){
   if(!homeReady){message='Shop GPS is still missing. Cannot rank shots by distance toward the shop. Save the shop GPS to calculate this plan.'}
   else if(!known.length){message='Add at least one pending shot location to calculate distances from the shop.'}
   else{
     order=[...known].sort((a,b)=>hav(b,shop())-hav(a,shop())).concat(unknown);
     usable=true;
     message=unknown.length?'Located shots are ordered farthest to nearest shop; unlocated shots are listed last and still need GPS.':'Shots are ordered from farthest to nearest shop by straight-line distance.';
   }
 }else if(mode==='short'||mode==='short_near'){
   if(pending.length){
     finalShot=choices[0];
     if(mode==='short_near'&&homeReady){
       const candidates=pending.filter(p=>coordsValid(p)&&feet(p)<=minFeet+Math.max(20,minFeet*.25));
       if(candidates.length)finalShot=candidates.sort((a,b)=>hav(a,shop())-hav(b,shop())||feet(a)-feet(b))[0];
     }
     let before=pending.filter(p=>p.id!==finalShot.id);
     if(homeReady&&before.every(coordsValid)&&coordsValid(finalShot)&&before.length>1&&before.length<=7){
       const variants=permutations(before);
       before=variants.reduce((best,p)=>scoreRoute([...p,finalShot],true)<scoreRoute([...best,finalShot],true)-1e-9?p:best,variants[0]);
     }
     order=[...before,finalShot];usable=true;
   }
   if(mode==='short'){
     message=finalShot?`Kept ${finalShot.name} (${feet(finalShot)} ft) for last. ${allGeo?'Earlier shots are arranged to reduce straight-line travel.':'Add shop and remaining shot GPS for full travel optimization.'}`:'Add bore shots to plan your day.';
   }else{
     message=!homeReady?'Shop GPS is missing. A shortest shot is provisionally last, but BoreLab cannot choose the short shot nearest the shop.':unknown.length?'A short shot near the shop is last where location data permits; missing shot GPS prevents a complete route.':`Ending with ${finalShot?.name||'a short shot'}, a short located shot near the shop.`;
   }
 }else if(mode==='drive'){

const DRAFTS_KEY='borelab-field-form-drafts-v1';
const GUIDED_DRAFT_KEY='borelab-field-guided-bore-v1';
const DRAFT_FORMS=new Set(['job-details','shot','time','mud-batch']);
let pendingDraftForm=null,draftSaveTimer=null;
function draftStore(){try{const data=JSON.parse(localStorage.getItem(DRAFTS_KEY)||'{}');return data&&typeof data==='object'&&!Array.isArray(data)?data:{}}catch{return {}}}
function draftKey(form){return form&&DRAFT_FORMS.has(form.dataset.form)?(typeof state==='undefined'||!state?.activeJobId?'':state.activeJobId+':')+form.dataset.form+':'+(form.dataset.id||'new'):''}
function draftStatus(form,message){
 if(!form||!form.isConnected)return;
 let status=form.querySelector('.ux-draft-status');
 if(!status){status=document.createElement('span');status.className='ux-draft-status';status.setAttribute('role','status');
  (form.querySelector('.modal-footer')||form).appendChild(status);}
 status.textContent=message;
}
function snapshotDraft(form){
 return [...form.elements].filter(e=>e.name&&e.type!=='file'&&!['submit','button'].includes(e.type)).slice(0,100)
 .map(e=>({name:e.name,type:e.type,value:String(e.value||'').slice(0,5000),checked:!!e.checked}));
}
function saveDraftForForm(form){
 const key=draftKey(form);if(!key)return;
 const store=draftStore();store[key]={fields:snapshotDraft(form),at:Date.now()};
 try{localStorage.setItem(DRAFTS_KEY,JSON.stringify(store));draftStatus(form,'✓ Draft saved on this device');}
 catch{draftStatus(form,'Draft could not be saved. Check storage.')}
}
function scheduleFormDraft(form){
 if(!draftKey(form))return;
 pendingDraftForm=form;draftStatus(form,'Saving draft…');
 clearTimeout(draftSaveTimer);draftSaveTimer=setTimeout(flushPendingDraft,250);
}
function flushPendingDraft(){clearTimeout(draftSaveTimer);draftSaveTimer=null;const f=pendingDraftForm;pendingDraftForm=null;if(f)saveDraftForForm(f);}
function clearFormDraft(form){
 const key=draftKey(form);if(!key)return;
 if(pendingDraftForm===form){pendingDraftForm=null;clearTimeout(draftSaveTimer);draftSaveTimer=null}
 const data=draftStore();delete data[key];try{localStorage.setItem(DRAFTS_KEY,JSON.stringify(data))}catch{}
}
function restoreFormDraft(form){
 const key=draftKey(form);if(!key)return;
 const saved=draftStore()[key];if(!saved||!Array.isArray(saved.fields))return;
 const fields=[...form.elements].filter(e=>e.name&&e.type!=='file'&&!['submit','button'].includes(e.type));
 for(let i=0;i<Math.min(fields.length,saved.fields.length);i++){
  const el=fields[i],old=saved.fields[i];if(el.name!==old.name||el.type!==old.type)continue;
  if(el.type==='checkbox'||el.type==='radio')el.checked=!!old.checked;
  else if(!el.readOnly&&!el.disabled)el.value=old.value;
 }
 draftStatus(form,'↶ Restored your unfinished draft');
}
function persistGuidedDraft(){if(!guidedDraft)return;try{localStorage.setItem(GUIDED_DRAFT_KEY,JSON.stringify({...guidedDraft,step:guidedStep,at:Date.now()}))}catch{}}
function clearGuidedDraft(){guidedDraft=null;try{localStorage.removeItem(GUIDED_DRAFT_KEY)}catch{}}
function enhanceNumericInputs(root){
 if(!root)return;
 root.querySelectorAll('input[type="number"]').forEach(input=>{
  if(!input.hasAttribute('inputmode'))input.setAttribute('inputmode',input.step==='1'?'numeric':'decimal');
  if(!input.hasAttribute('enterkeyhint'))input.setAttribute('enterkeyhint','done');
 });
}

function showModal(body){flushPendingDraft();modal=body;$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Edit BoreLab details">${body}</div></div>`;document.body.style.overflow='hidden';const form=$('#modalRoot form[data-form]');restoreFormDraft(form);enhanceNumericInputs($('#modalRoot'));}
function closeModal(){flushPendingDraft();activeManualSearch=null;modal='';$('#modalRoot').innerHTML='';document.body.style.overflow=''}
const modalHead=t=>`<div class="modal-head"><h2>${esc(t)}</h2><button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">✕</button></div>`;
function reelTotal(location){return state.reels.filter(r=>!r.archived&&(!location||r.location===location)).reduce((a,r)=>a+Number(r.remaining||0),0)}
function reelMode(){return state.reels.length>0}
function pipeOnTruck(){return reelMode()?reelTotal('truck'):Math.max(0,Number(state.pipeAvailable)||0)}
function reelReserved(id,exceptShot){return state.pipeReservations.filter(h=>h.reelId===id&&h.shotId!==exceptShot).reduce((a,h)=>a+Number(h.feet||0),0)}
function pipeOnShot(shot){
 const used=state.pipeMoves.filter(m=>m.type==='installed'&&m.shotId===shot.id).reduce((a,m)=>a+Number(m.feet||0),0);
 return used>0?used:shot.pipeUsed!==''&&shot.pipeUsed!=null?Number(shot.pipeUsed):null;
}

 ${state.pipeReservations.length?`<div class="card spaced"><h3>Pipe Reserved for Shots</h3>${state.pipeReservations.map(h=>{const reel=state.reels.find(x=>x.id===h.reelId),shot=state.shots.find(x=>x.id===h.shotId);return `<div class="between" style="padding:9px 0"><div><strong class="smalltext">${esc(shot?.name||'Unknown shot')}</strong><p class="tiny muted">${esc(reel?.name||'Unknown reel')} · ${fmt(h.feet,1)} ft reserved</p></div><button class="btn micro ghost" data-action="reel-release" data-id="${esc(h.id)}">Release</button></div>`}).join('')}</div>`:''}
 ${history.length?`<div class="card spaced"><h3>Recent Pipe Activity</h3>${history.map(m=>{const reel=state.reels.find(r=>r.id===m.reelId),shot=state.shots.find(sh=>sh.id===m.shotId);return `<div class="pipe-ledger-row"><div><strong class="smalltext">${esc(reel?.name||'Reel')} · ${esc(m.type)}</strong><p class="tiny muted">${esc(shot?.name||m.note||'Inventory update')} · ${esc(fullDate(m.at))}</p></div><strong>${m.type==='installed'||m.type==='removed'?'-':'+'}${fmt(m.feet,1)} ft</strong></div>`}).join('')}</div>`:''}
 <p class="tiny muted spaced">Footage is inventory, not proof that a particular reel can make a continuous pull. Check length, material, fittings and reel constraints before starting.</p>${footnote()}</div>`;
}

 const reel=state.reels.find(r=>r.id===id);if(!reel)return;

 showModal(`${modalHead(title)}<p class="smalltext muted">${esc(reel.name)} · ${fmt(reel.remaining,1)} ft remaining · ${fmt(reelReserved(id),1)} ft reserved.</p>
 <form data-form="reel-action" data-id="${esc(id)}" data-kind="${esc(kind)}">
 ${kind==='use'||kind==='reserve'?`<label class="field">Shot<select name="shotId">${kind==='use'?'<option value="">General usage / unassigned</option>':''}${state.shots.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · planned ${fmt(pipeNeed(x),1)} ft</option>`).join('')}</select></label>`:''}
 ${kind==='adjust'?`<label class="field">Adjustment<select name="direction"><option value="add">Add footage (delivery / corrected count)</option><option value="remove">Remove footage (damage / returned / corrected count)</option></select></label>`:''}
 <label class="field">Feet<input type="number" name="feet" min="0.1" step="0.1" required placeholder="Enter footage"></label>
 <label class="field">Reason / note<input name="note" maxlength="180" placeholder="Optional"></label>

function archiveReel(id){
 const reel=state.reels.find(x=>x.id===id);if(!reel)return;
 if(Number(reel.remaining)>0||reelReserved(id)>0)return notify('Empty the reel and release reservations before archiving.');
 if(!confirm(`Archive ${reel.name}? Its history stays saved.`))return;
 reel.archived=true;save();render();notify('Empty reel archived.');
}
function saveReel(form,values){
 const id=form.dataset.id,old=state.reels.find(x=>x.id===id);
 const name=String(values.name||'').trim(),location=values.location==='yard'?'yard':'truck';
 const value=Number(values.remaining);
 if(!name)return notify('Reel name required.');
 if(!old&&(!Number.isFinite(value)||value<0))return notify('Enter valid starting footage.');
 const reel={...old,id:old?.id||uid(),name:name.slice(0,80),size:String(values.size||'').trim().slice(0,40),material:String(values.material||'').trim().slice(0,60),location,mustEmpty:values.mustEmpty==='yes',notes:String(values.notes||'').trim().slice(0,1000),remaining:old?Number(old.remaining):value,initialFeet:old?.initialFeet??value,archived:old?.archived||false};
 if(old)state.reels=state.reels.map(x=>x.id===id?reel:x);else state.reels.push(reel);
 save();closeModal();render();notify('Reel saved: '+reel.name+'.');
}
function recordReelAction(form,values){
 const reel=state.reels.find(r=>r.id===form.dataset.id&&!r.archived);
 if(!reel)return notify('Reel not found.');
 const kind=form.dataset.kind,n=Number(values.feet),shotId=String(values.shotId||'');
 const reservationsBefore=JSON.parse(JSON.stringify(state.pipeReservations||[]));
 const priorShot=shotId?JSON.parse(JSON.stringify(state.shots.find(s=>s.id===shotId)||null)):null;
 if(!Number.isFinite(n)||n<=0||Math.abs(Math.round(n*10)-n*10)>1e-6)return notify('Enter positive footage in tenths of a foot.');
 const feet=Math.round(n*10)/10;
 if((kind==='reserve'||(kind==='use'&&shotId))&&!state.shots.some(x=>x.id===shotId))return notify('Select a valid shot.');
 if(kind==='reserve'){
   const free=Number(reel.remaining)-reelReserved(reel.id);
   if(feet>free+0.00001)return notify('Not enough unreserved footage on this reel.');
   state.pipeReservations.push({id:uid(),jobId:state.activeJobId,reelId:reel.id,shotId,feet,at:new Date().toISOString()});
   save();closeModal();render();notify(`${feet} ft reserved for this shot.`);
   return;
 }
 let type='',newRemaining=Number(reel.remaining),before=newRemaining;
 if(kind==='use'){
   const otherReserved=reelReserved(reel.id,shotId);
   if(feet>newRemaining-otherReserved+0.00001)return notify('Not enough available pipe; footage reserved for other shots cannot be used.');
   newRemaining-=feet;type='installed';
   if(shotId){
     let release=feet;
     for(const item of state.pipeReservations.filter(h=>h.reelId===reel.id&&h.shotId===shotId)){
       const taken=Math.min(release,item.feet);item.feet=Math.round((item.feet-taken)*10)/10;release-=taken;
       if(release<=0)break;
     }
     state.pipeReservations=state.pipeReservations.filter(h=>h.feet>0);
   }
 }else if(kind==='adjust'){
   if(values.direction==='add'){newRemaining+=feet;type='added'}
   else{
     if(feet>newRemaining-reelReserved(reel.id)+0.00001)return notify('Cannot remove pipe already reserved or more pipe than the reel holds.');
     newRemaining-=feet;type='removed';
   }
 }else return notify('Unknown pipe action.');
 reel.remaining=Math.round(newRemaining*10)/10;
 const pipeMove={id:uid(),jobId:state.activeJobId,reelId:reel.id,shotId,type,feet,at:new Date().toISOString(),before,after:reel.remaining,note:String(values.note||'').trim().slice(0,180)};
 state.pipeMoves.push(pipeMove);
 if(typeof window!=='undefined')window.BoreLabFieldOps?.journal(type==='installed'?'Reel pipe logged':'Reel balance adjusted',state.activeJobId,shotId,priorShot,priorShot,{reelBefore:[{id:reel.id,remaining:before}],reelAfter:[{id:reel.id,remaining:reel.remaining}],moveIds:[pipeMove.id],reservationsBefore,reservationsAfter:JSON.parse(JSON.stringify(state.pipeReservations||[]))});
 save();closeModal();render();notify(`${feet} ft ${type} · ${fmt(reel.remaining,1)} ft left on ${reel.name}.`);
}
function saveCompanyEquipment(form,values){
 const name=String(values.name||'').trim(),type=String(values.type||'Other').trim();
 if(!name)return notify('Enter an equipment name.');
 if(!['Drill','Locator','Mixer','Truck','Trailer','Other'].includes(type))return notify('Select an equipment type.');
 const id=form.dataset.id,old=state.equipment.find(e=>e.id===id);
 const e={...old,id:old?.id||uid(),name:name.slice(0,90),type,serial:String(values.serial||'').trim().slice(0,80),notes:String(values.notes||'').trim().slice(0,1000),archived:old?.archived||false};
 if(type==='Truck'){
  const number=(field,whole=false)=>{
   const raw=String(values[field]??'').trim();
   if(!raw)return '';
   const n=Number(raw);
   if(!Number.isFinite(n)||n<0||(whole&&!Number.isInteger(n)))throw Error('Check '+field.replaceAll(/[A-Z]/g,c=>' '+c.toLowerCase()));
   return n;
  };
  try{
   e.odometer=number('odometer',true);e.engineHours=number('engineHours');
   e.lastOilMiles=number('lastOilMiles',true);e.lastOilHours=number('lastOilHours');
   e.oilIntervalMiles=number('oilIntervalMiles',true);e.oilIntervalMonths=number('oilIntervalMonths',true);e.oilIntervalHours=number('oilIntervalHours');
   e.lastOilAt=String(values.lastOilAt||'').trim();
   if(e.lastOilAt&&!/^\d{4}-\d{2}-\d{2}$/.test(e.lastOilAt))throw Error('Invalid service date');
   if(e.lastOilAt&&new Date(e.lastOilAt+'T12:00:00')>new Date(Date.now()+24*3600000))throw Error('Last oil change cannot be in the future');

  e.serviceHistory=Array.isArray(old?.serviceHistory)?old.serviceHistory:[];

 if(truck.lastOilAt&&date<truck.lastOilAt)return notify('This service predates the current last-oil record. Edit the baseline in Garage to correct old history.');

function oilStatus(truck,now=new Date()){
 const lastAt=truck.lastOilAt||'',lastMiles=truck.lastOilMiles,lastHours=truck.lastOilHours;
 const miles=truck.odometer,hrs=truck.engineHours;
 const intervalMiles=Number(truck.oilIntervalMiles),intervalMonths=Number(truck.oilIntervalMonths),intervalHours=Number(truck.oilIntervalHours);
 const metrics=[],remaining=[];
 if(intervalMiles>0&&lastMiles!==''&&lastMiles!=null&&Number.isFinite(Number(lastMiles))){
   const next=Number(lastMiles)+intervalMiles;
   metrics.push(`Next mileage: ${fmt(next)} mi`);
   if(miles!==''&&miles!=null&&Number.isFinite(Number(miles))){
     const left=next-Number(miles);
     remaining.push({left,near:Math.min(500,Math.max(100,intervalMiles*.1)),unit:'mi'});
   }
 }
 if(intervalHours>0&&lastHours!==''&&lastHours!=null&&Number.isFinite(Number(lastHours))){
   const next=Number(lastHours)+intervalHours;
   metrics.push(`Next engine hours: ${fmt(next,1)} h`);
   if(hrs!==''&&hrs!=null&&Number.isFinite(Number(hrs))){
     const left=next-Number(hrs);
     remaining.push({left,near:Math.min(25,Math.max(5,intervalHours*.1)),unit:'h'});
   }
 }
 if(intervalMonths>0&&lastAt){
   const date=new Date(lastAt+'T12:00:00');
   if(Number.isFinite(date.getTime())){
     const day=date.getDate();date.setDate(1);date.setMonth(date.getMonth()+Math.floor(intervalMonths));
     const final=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();date.setDate(Math.min(day,final));
     const next=date.toISOString().slice(0,10);
     metrics.push(`Next due date: ${next}`);
     const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
     const due=new Date(date.getFullYear(),date.getMonth(),date.getDate());
     const left=Math.ceil((due-today)/86400000);
     remaining.push({left,near:30,unit:'days'});
   }
 }
 if(!lastAt&&(lastMiles===''||lastMiles==null)&&(lastHours===''||lastHours==null))return {kind:'setup',label:'Record last oil change',details:'Enter the last service date and/or mileage to begin tracking.',metrics};
 if(!intervalMiles&&!intervalMonths&&!intervalHours)return {kind:'setup',label:'Set service interval',details:'Use the oil interval recommended by the vehicle manufacturer or fleet policy.',metrics};
 if(!metrics.length||!remaining.length)return {kind:'setup',label:'Complete oil schedule',details:'Enter matching last-service and current mileage, date, or engine hours to determine when oil is due.',metrics};
 const due=remaining.filter(x=>x.left<=0),soon=remaining.filter(x=>x.left>0&&x.left<=x.near);
 if(due.length)return {kind:'due',label:'Oil change due',details:due.map(x=>`${fmt(Math.abs(x.left),1)} ${x.unit} ${x.left<0?'past due':'at interval'}`).join(' · '),metrics};
 if(soon.length)return {kind:'soon',label:'Oil change coming up',details:soon.map(x=>`${fmt(x.left,1)} ${x.unit} remaining`).join(' · '),metrics};
 return {kind:'good',label:'Oil schedule on track',details:'Update the odometer and engine hours to keep this estimate current.',metrics};
}

function setShotStatus(id){
 const shot=state.shots.find(x=>x.id===id);if(!shot)return;
 if(shot.status==='progress'&&typeof window!=='undefined'&&window.BoreLabFieldOps){window.BoreLabFieldOps.beginCompletion(state.activeJobId,id);return;}
 if(shot.status==='planned'&&typeof window!=='undefined'&&window.BoreLabFieldOps&&!window.BoreLabFieldOps.warnBeforeStart(state.activeJobId,id))return;
 if(shot.status==='complete'&&!confirm('Reopen this completed bore?'))return;
 const before=JSON.parse(JSON.stringify(shot));
 const now=new Date().toISOString();
 if(shot.status==='planned'){shot.status='progress';shot.startedAt=shot.startedAt||now;}
 else if(shot.status==='progress'){shot.status='complete';shot.startedAt=shot.startedAt||now;shot.completedAt=now;}
 else{shot.status='planned';shot.completedAt=null;}
 shot.updatedAt=now;
 if(typeof window!=='undefined')window.BoreLabFieldOps?.journal('Bore status updated',state.activeJobId,id,before,shot);
 save();closeModal();render();
 notify(`${shot.name} is now ${shot.status==='complete'?'complete':shot.status==='progress'?'in progress':'pending'}.`);
}
