name: Build BoreLab Field Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test route-planning logic
        run: node tests/route-planner.test.cjs
      - name: Test field operations and maps integration
        run: node tests/field-operations.test.cjs
      - name: Test collapsible route selector
        run: node tests/route-picker.test.cjs
      - name: Test pipe reels and truck oil service reminders
        run: node tests/pipe-maintenance.test.cjs
      - name: Test daily closeouts, history and native PDF bridge
        run: node tests/closeout-pdf.test.cjs
      - name: Test MixLab tanks, product rates and mixing history
        run: node tests/mixlab.test.cjs
      - name: Test photo label scanning and reusable Mud Products
        run: node tests/mud-scanner.test.cjs
      - name: Test premixed tank fraction shortcuts
        run: node tests/mud-level-presets.test.cjs
      - name: Test MixLab Pro product inventory and stock deductions
        run: node tests/mud-inventory.test.cjs
      - name: Test quick final fill fraction choices
        run: node tests/mud-target-presets.test.cjs
      - name: Test manual catalog and offline storage bridge
        run: node tests/manual-library.test.cjs
      - name: Test offline manual search and in-app PDF reader integration
        run: node tests/manual-search.test.cjs
      - name: Test field-friendly UI, guided bore, and saved preferences
        run: node tests/ux-redesign.test.cjs
      - name: Test visual polish, navigation and compact phone dashboard
        run: node tests/ux-visual-polish.test.cjs
      - name: Test Smart Job Workspace, Back, search, drafts and numeric workflow
        run: node tests/workspace-batch.test.cjs
      - name: Test legacy job migration and combined daily multi-job reports
        run: node tests/multi-jobs.test.cjs
      - name: Test HDD crew silhouette in dashboard hero
        run: node tests/crew-hero.test.cjs
      - name: Test Ask BoreLab morning assistant
        run: node tests/field-assistant.test.cjs
      - name: Test editable pipe size, address scanning and start-job route
        run: node tests/field-upgrades.test.cjs
      - name: Test multi-conduit planning and shot sheet scanning
        run: node tests/multi-conduit-shot-sheet.test.cjs
      - name: Test printed and handwritten locations, Plus Codes and daily reels
        run: node tests/location-daily-reels.test.cjs
      - name: Test paperwork OCR and GPS recovery
        run: node tests/paperwork-ocr-gps.test.cjs
      - name: Test Plus Code GPS and daily reel layout regression
        run: node tests/plus-code-reel-layout.test.cjs
      - name: Test shot-sheet import placement in Add Bore
        run: node tests/scan-placement.test.cjs
      - name: Test BoreLab v0.17 scanner, shot board and workday planning
        run: node tests/workday-batch-v017.test.cjs
      - name: Test inline Add Bore address scanner
        run: node tests/inline-address-scan.test.cjs
      - name: Test address-only bore form scanner
        run: node tests/address-only-scan.test.cjs
      - name: Test BoreLab v0.18 field operations, recovery and readiness
        run: node tests/field-ops-v018.test.cjs
      - name: Test command center and live field cards
        run: node tests/command-center.test.cjs
      - name: Test concept-inspired smart shot cards and reel manager
        run: node tests/visual-polish-v2.test.cjs
      - name: Test customizable home dashboard presets, widgets and fallback
        run: node tests/home-dashboard-v2.test.cjs
      - name: Test interactive jobsite map, pins, filters, safe routes and offline plot
        run: node tests/jobsite-map.test.cjs
      - name: Test dated bore search and installed field map pins
        run: node tests/dated-field-pins.test.cjs
      - name: Test As-Built 2.0 field calendar, GPS photo linking, map jumps and PDF
        run: node tests/asbuilt-2.test.cjs
      - name: Test unified Calendar and Atlas, across-job GPS search, and closeout review
        run: node tests/atlas-calendar-3.test.cjs
      - name: Test closeout assistant and photo timeline v2
        run: node tests/closeout-photo-v2.test.cjs
      - name: Test connected operations 3.0 crew intelligence equipment and planner
        run: node tests/connected-ops-3.test.cjs
      - name: Test Crew Mode 1.0 local preview and personal time/photo safety
        run: node tests/crew-mode.test.cjs
      - name: Test Supervisor Mode 1.0 portfolio reviews and saved data safety
        run: node tests/supervisor-mode.test.cjs
      - name: Test local PIN accounts and role-based UI navigation safeguards
        run: node tests/local-accounts.test.cjs
      - name: Test unified white-orange field drawer and right-hand quick actions
        run: node tests/field-navigation-v019.test.cjs
      - name: Test floating field quick actions and reversible PIN test mode
        run: node tests/field-fab-v020.test.cjs
      - name: Test Daily Replay, Compare Days, Missing Evidence and Monthly Insights
        run: node tests/field-insights-v021.test.cjs
      - name: Test Edge Tab, Peek, field markers, Photo Inbox, Save & Next and Field Story
        run: node tests/field-edge-v022.test.cjs
      - name: Test Material Pickup, Next Move, Photo Comparison and collapsible Home header
        run: node tests/field-productivity-v023.test.cjs
      - name: Test 0.24 reel workflow, utility crossings, companion import and bridge
        run: node tests/field-workflow-v024.test.cjs
      - name: Test v0.26 As-Built Closeout Studio and Google Earth exports
        run: node tests/closeout-studio-v026.test.cjs
      - name: Test Field Command 3.0 productivity and storage safety
        run: node tests/field-command-v027.test.cjs
      - name: Test merged Bores workspace and unified sidebar search
        run: node tests/interface-cleanup-v028.test.cjs
      - name: Test v0.29 streamlined dashboard, Bores and Pipe Reels
        run: node tests/streamlined-v029.test.cjs
      - name: Test v0.30 Calendar date cards and Atlas Daily Replay
        run: node tests/calendar-replay-v030.test.cjs
      - name: Test v0.31 integrated Jobsite Map Calendar and bore status colors
        run: node tests/map-calendar-cleanup-v031.test.cjs
      - name: Test Equipment, Tool Inventory, and Mud workspaces
        run: node tests/field-workspaces-v032.test.cjs
      - name: Test Safety Contacts and Receipt Vault
        run: node tests/safety-receipts-v033.test.cjs
      - name: Test Connect Calendar and Crew Time bridge
        run: node --test tests/connect-calendar.test.cjs
      - name: Test crew truck inventory snapshots
        run: node --test tests/inventory-connect.test.cjs
      - name: Test named crews and dated dispatch
        run: node --test tests/crew-teams.test.cjs
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep a consistent test signing identity across future CI builds.
      # The original v0.2 debug APK was not signed using this persistent key.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: borelab-field-debug-signing-v1
      - name: Test v0.25 map geometry, custom symbols, media vault and drill crew attribution
        run: node tests/field-mapping-media-v025.test.cjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoreLab-Field-v0.36.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
