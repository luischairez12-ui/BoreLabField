name: Build BoreLab Field Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test route-planning logic
        run: node tests/route-planner.test.cjs
      - name: Test field operations and maps integration
        run: node tests/field-operations.test.cjs
      - name: Test collapsible route selector
        run: node tests/route-picker.test.cjs
      - name: Test pipe reels and truck oil service reminders
        run: node tests/pipe-maintenance.test.cjs
      - name: Test daily closeouts, history and native PDF bridge
        run: node tests/closeout-pdf.test.cjs
      - name: Test MixLab tanks, product rates and mixing history
        run: node tests/mixlab.test.cjs
      - name: Test photo label scanning and reusable Mud Products
        run: node tests/mud-scanner.test.cjs
      - name: Test premixed tank fraction shortcuts
        run: node tests/mud-level-presets.test.cjs
      - name: Test MixLab Pro product inventory and stock deductions
        run: node tests/mud-inventory.test.cjs
      - name: Test quick final fill fraction choices
        run: node tests/mud-target-presets.test.cjs
      - name: Test manual catalog and offline storage bridge
        run: node tests/manual-library.test.cjs
      - name: Test offline manual search and in-app PDF reader integration
        run: node tests/manual-search.test.cjs
      - name: Test field-friendly UI, guided bore, and saved preferences
        run: node tests/ux-redesign.test.cjs
      - name: Test visual polish, navigation and compact phone dashboard
        run: node tests/ux-visual-polish.test.cjs
      - name: Test Smart Job Workspace, Back, search, drafts and numeric workflow
        run: node tests/workspace-batch.test.cjs
      - name: Test legacy job migration and combined daily multi-job reports
        run: node tests/multi-jobs.test.cjs
      - name: Test HDD crew silhouette in dashboard hero
        run: node tests/crew-hero.test.cjs
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep a consistent test signing identity across future CI builds.
      # The original v0.2 debug APK was not signed using this persistent key.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: borelab-field-debug-signing-v1
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoreLab-Field-v0.12.1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
