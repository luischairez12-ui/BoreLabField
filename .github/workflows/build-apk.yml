name: Build BoreLab Field Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test route-planning logic
        run: node tests/route-planner.test.cjs
      - name: Test field operations and maps integration
        run: node tests/field-operations.test.cjs
      - name: Test collapsible route selector
        run: node tests/route-picker.test.cjs
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep a consistent test signing identity across future CI builds.
      # The original v0.2 debug APK was not signed using this persistent key.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: borelab-field-debug-signing-v1
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoreLab-Field-v0.4.1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
